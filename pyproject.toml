# Tooling configuration only; the project is not packaged.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["extronsis_exporter"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# E/F: pycodestyle+pyflakes, I: isort, B: bugbear, UP: pyupgrade, S: bandit (security)
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert is how pytest works
"extronsis_exporter/__main__.py" = ["E501"]  # embedded HTML/CSS on the index page
