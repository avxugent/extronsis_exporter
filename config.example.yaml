# extronsis-exporter example configuration
# Copy this file to config.yaml and adjust to your environment.

# ── HTTP server ───────────────────────────────────────────────────────────────

# Address the HTTP server listens on.
listen_host: "0.0.0.0"

# Port the HTTP server listens on.
listen_port: 9877

# ── Access control ────────────────────────────────────────────────────────────
# All of this is optional and off by default (a warning is logged at startup).
# /healthz is never restricted (container/orchestrator liveness).

# Client IP allowlist: only these source IPs/CIDRs may call /, /probe and
# /metrics (others get 403). Use it to limit access to your Prometheus server.
# Env var EXTRONSIS_ALLOWED_CLIENTS (comma-separated) overrides. Behind a reverse
# proxy the exporter sees the proxy's address, not the real client's -- enforce
# the ACL at the proxy in that case. Empty = any client.
#
# allowed_clients:
#   - 10.1.2.3
#   - 10.1.0.0/24

# HTTP Basic auth protecting /, /probe and /metrics. Env vars
# EXTRONSIS_AUTH_USERNAME / EXTRONSIS_AUTH_PASSWORD override these values --
# prefer them over a plaintext password in this file. The exporter serves plain
# HTTP, so run it behind a TLS-terminating reverse proxy.
#
# Prometheus side:
#   scrape_configs:
#     - job_name: extron
#       metrics_path: /probe
#       basic_auth:
#         username: prometheus
#         password_file: /etc/prometheus/extron.pass
#
# auth:
#   username: prometheus
#   password: change-me

# Restrict which targets GET /probe?host=... may contact. Without this, any
# caller can make the exporter send a request to an arbitrary host and path.
# Regexes are fullmatch()ed against the literal host string (no DNS resolution --
# anchor them tightly). Rejected requests get 403. Devices listed under
# `devices:` below are never checked. Empty/omitted = unrestricted.
#
# allowed_hosts:
#   - '^switch\d+\.example\.org$'
#   - '192\.168\.1\.\d+'
#
# Ports URL mode may target (only enforced when allowed_hosts is set).
# allowed_ports: [443]

# ── Logging ───────────────────────────────────────────────────────────────────

# Minimum log level: DEBUG | INFO | WARNING | ERROR | CRITICAL
log_level: INFO

# ── Devices ───────────────────────────────────────────────────────────────────

# List of Extron devices to monitor (video switches, controllers, touch
# panels, DSPs, ...). Any device that exposes a web UI over HTTPS with a
# <div id="version"> element showing the firmware/software version works.
#
# This list is OPTIONAL. When left empty (or omitted entirely) the exporter
# operates in URL-parameter mode only: every probe request must supply the
# target device via query parameters, e.g.:
#
#   GET /probe?host=192.168.1.10&name=room-101
#
# When devices ARE listed here they are probed on every plain GET /probe
# request (config-file mode). URL-parameter mode is always available alongside
# config-file mode regardless of whether devices are listed below.
#
# Supported query parameters (all except 'host' are optional):
#   host        Hostname or IP address of the device  (required)
#   name        Label used in Prometheus metrics       (default: value of host)
#   port        HTTPS port                             (default: 443)
#   path        Path of the page to fetch              (default: /www/index.html)
#   timeout     Request timeout in seconds             (default: 10.0)
#   verify_tls  Verify the device's TLS certificate     (default: false)
# devices:
#   - name: switch-room-101          # Unique label used in all Prometheus metrics
#     host: 192.168.1.10             # Hostname or IP address of the device
#     port: 443                      # HTTPS port
#     path: /www/index.html          # Path of the page showing #version
#     timeout: 10.0                  # Request timeout in seconds
#     verify_tls: false              # Most Extron devices use self-signed certs

#   - name: controller-lobby
#     host: 192.168.1.20
#     port: 443
#     path: /www/index.html
#     timeout: 10.0
#     verify_tls: false
