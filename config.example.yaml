# extronsis-exporter example configuration
# Copy this file to config.yaml and adjust to your environment.

# ── HTTP server ───────────────────────────────────────────────────────────────

# Address the HTTP server listens on.
listen_host: "0.0.0.0"

# Port the HTTP server listens on.
listen_port: 9877

# ── Logging ───────────────────────────────────────────────────────────────────

# Minimum log level: DEBUG | INFO | WARNING | ERROR | CRITICAL
log_level: INFO

# ── Devices ───────────────────────────────────────────────────────────────────

# List of Extron devices to monitor (video switches, controllers, touch
# panels, DSPs, ...). Any device that exposes a web UI over HTTPS with a
# <div id="version"> element showing the firmware/software version works.
#
# This list is OPTIONAL. When left empty (or omitted entirely) the exporter
# operates in URL-parameter mode only: every probe request must supply the
# target device via query parameters, e.g.:
#
#   GET /probe?host=192.168.1.10&name=room-101
#
# When devices ARE listed here they are probed on every plain GET /probe
# request (config-file mode). URL-parameter mode is always available alongside
# config-file mode regardless of whether devices are listed below.
#
# Supported query parameters (all except 'host' are optional):
#   host        Hostname or IP address of the device  (required)
#   name        Label used in Prometheus metrics       (default: value of host)
#   port        HTTPS port                             (default: 443)
#   path        Path of the page to fetch              (default: /www/index.html)
#   timeout     Request timeout in seconds             (default: 10.0)
#   verify_tls  Verify the device's TLS certificate     (default: false)
# devices:
#   - name: switch-room-101          # Unique label used in all Prometheus metrics
#     host: 192.168.1.10             # Hostname or IP address of the device
#     port: 443                      # HTTPS port
#     path: /www/index.html          # Path of the page showing #version
#     timeout: 10.0                  # Request timeout in seconds
#     verify_tls: false              # Most Extron devices use self-signed certs

#   - name: controller-lobby
#     host: 192.168.1.20
#     port: 443
#     path: /www/index.html
#     timeout: 10.0
#     verify_tls: false
